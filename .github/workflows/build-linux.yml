name: Build Linux standalone release
on:
  workflow_dispatch:
  push:
    branches: [codex/sh09-emulation]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Tests/**'
      - 'Assets/**'
      - 'docs/**'
      - 'tools/package_linux.py'
      - 'tools/linux/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev xvfb
      - name: Get matching JUCE source
        run: git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure generic x86-64 standalone
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DKB09_STANDALONE_ONLY=ON -DKB09_BUILD_AU=OFF -DKB09_BUILD_AAX=OFF
      - name: Build standalone and verification tools
        run: cmake --build build-linux --target SH09_Standalone SH09DSPTests SH09FilterNonlinearTests SH09ProcessorTests SH09PresetFilesTests SH09FactoryAudition KB09UpdateTests SH09GUIRender KB09DialogPreview --parallel 2
      - name: Run DSP and processor tests
        run: xvfb-run -a ctest --test-dir build-linux --output-on-failure
      - name: Check dialogs and editor rendering
        run: |
          xvfb-run -a build-linux/KB09DialogPreview_artefacts/Release/KB09DialogPreview linux-dialog-validation
          xvfb-run -a build-linux/SH09GUIRender_artefacts/Release/SH09GUIRender linux-gui-validation
      - name: Check executable and shared library dependencies
        run: |
          file 'build-linux/SH09_artefacts/Release/Standalone/Toyland KB-09'
          ldd 'build-linux/SH09_artefacts/Release/Standalone/Toyland KB-09' | tee linux-dependencies.txt
          if grep -q 'not found' linux-dependencies.txt; then exit 1; fi
      - name: Package standalone, manual and launchers
        run: python3 tools/package_linux.py --build build-linux --output linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: KB-09-Linux
          path: linux-release/Toyland KB-09 for Linux (Standalone Only).zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB-09-Linux-validation
          path: |
            linux-dependencies.txt
            build-linux/Testing/Temporary/LastTest.log
            linux-gui-validation/GUIRender.log
            linux-dialog-validation/*.log
          retention-days: 30
