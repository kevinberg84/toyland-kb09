name: Build Linux standalone release
on:
  workflow_dispatch:
    inputs:
      kde_diagnostic:
        description: 'Exercise native fullscreen and shortcut prompt on Arch KDE/XWayland'
        type: boolean
        default: false
  push:
    branches: [codex/sh09-emulation]
    paths:
      - '.github/workflows/build-linux.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'Tests/**'
      - 'Assets/**'
      - 'docs/**'
      - 'tools/package_linux.py'
      - 'tools/linux/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install native build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache openbox x11-utils libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev xvfb
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: linux-juce902-ccache-${{ github.run_id }}
          restore-keys: linux-juce902-ccache-
      - name: Get matching JUCE source
        run: git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure generic x86-64 standalone
        run: cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DKB09_STANDALONE_ONLY=ON -DKB09_BUILD_AU=OFF -DKB09_BUILD_AAX=OFF
      - name: Build standalone and verification tools
        run: cmake --build build-linux --target SH09_Standalone SH09DSPTests SH09ResonanceIntegrationTests SH09FilterNonlinearTests SH09ProcessorTests KB09MidiMappingTests KB09StandaloneMidiTests KB09ControlResponseTests KB09RateLampTests SH09PresetFilesTests SH09FactoryAudition KB09UpdateTests KB09MidiInputMemoryTests SH09GUIRender KB09DialogPreview --parallel 2
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: linux-juce902-ccache-${{ github.run_id }}
      - name: Preserve native validation executables
        uses: actions/upload-artifact@v4
        with:
          name: KB-09-Linux-validation-binaries
          path: |
            build-linux/SH09_artefacts/Release/Standalone/Toyland KB-09
            build-linux/*_artefacts/Release/*
            build-linux/SH09DSPTests
            build-linux/SH09ResonanceIntegrationTests
            build-linux/SH09FilterNonlinearTests
            build-linux/CTestTestfile.cmake
          retention-days: 7
      - name: Run DSP and processor tests
        run: |
          xvfb-run -a bash -euo pipefail -c '
            openbox >/tmp/kb09-test-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            ctest --test-dir build-linux --output-on-failure
          '

      - name: Check dialogs and editor rendering
        run: |
          xvfb-run -a bash -euo pipefail -c '
            openbox >/tmp/kb09-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            for attempt in {1..50}; do
              if xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"; then break; fi
              sleep 0.1
            done
            xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id"
            build-linux/KB09DialogPreview_artefacts/Release/KB09DialogPreview linux-dialog-validation
            build-linux/SH09GUIRender_artefacts/Release/SH09GUIRender linux-gui-validation
          '
      - name: Check executable and shared library dependencies
        run: |
          file 'build-linux/SH09_artefacts/Release/Standalone/Toyland KB-09'
          ldd 'build-linux/SH09_artefacts/Release/Standalone/Toyland KB-09' | tee linux-dependencies.txt
          if grep -q 'not found' linux-dependencies.txt; then exit 1; fi
      - name: Diagnose Arch KDE XWayland native window transitions
        if: inputs.kde_diagnostic
        run: |
          mkdir -p kde-window-validation
          docker run --rm \
            -v "$PWD/build-linux:/validation:ro" \
            -v "$PWD/tools/linux/test-kde-window.sh:/test-kde-window.sh:ro" \
            -v "$PWD/kde-window-validation:/results" \
            archlinux:base bash /test-kde-window.sh
      - uses: actions/upload-artifact@v4
        if: always() && inputs.kde_diagnostic
        with:
          name: KB-09-Arch-KDE-window-diagnostic
          path: kde-window-validation
          retention-days: 14
      - name: Package standalone, manual and launchers
        run: python3 tools/package_linux.py --build build-linux --output linux-release
      - uses: actions/upload-artifact@v4
        with:
          name: KB-09-Linux
          path: linux-release/Toyland KB-09 for Linux (Standalone Only) - UNVERIFIED.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KB-09-Linux-validation
          path: |
            linux-dependencies.txt
            build-linux/Testing/Temporary/LastTest.log
            linux-gui-validation/GUIRender.log
            linux-dialog-validation/*.log
          retention-days: 30
