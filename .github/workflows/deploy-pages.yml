name: Publish KB-09 website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'CMakeLists.txt'
      - 'README.md'
      - 'docs/FIDELITY.md'
      - 'docs/VALIDATION.md'
      - 'docs/manual/**'
      - 'tools/build_site.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build and check links
        run: python3 tools/build_site.py --output _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
