name: Build Mac release
on:
  workflow_dispatch:
    inputs:
      validated_run:
        description: 'Optional prior run whose native checks passed for identical source (package-transfer recovery only)'
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify reusable native validation for transfer recovery
        if: inputs.validated_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$VALIDATED_RUN" > previous-run.json
          gh api "repos/$GH_REPO/actions/runs/$VALIDATED_RUN/jobs" > previous-jobs.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('previous-run.json'))
          assert run['path']=='.github/workflows/build-macos.yml'
          required={'Build plug-ins and tests','Test audio engine and presets','Repeat real MIDI feedback interleaving checks','Test audio settings scrolling and dialog layouts','Test keyboard visual feedback and panel rendering','Check architectures and sign for development testing','Run Apple AU validation on this runner','Package Mac release'}
          steps={s['name']:s['conclusion'] for j in json.load(open('previous-jobs.json'))['jobs'] for s in j['steps']}
          assert all(steps.get(name)=='success' for name in required),steps
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('VALIDATED_SHA='+run['head_sha']+'\n')
          print('All required native checks passed in the prior run.')
          PY
          prior_sha=$(python3 -c "import json; print(json.load(open('previous-run.json'))['head_sha'])")
          git fetch origin "$prior_sha" --depth=1
          git diff --exit-code "$prior_sha" HEAD -- . ':!.github' ':!docs' ':!README.md' ':!tools/install-mac.command'
          echo 'Binary source, tests, assets, CMake and dependencies are unchanged.'
      - name: Get matching JUCE source
        run: git clone --depth 1 --branch 9.0.2 https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"
      - name: Configure universal Mac build
        run: cmake -S . -B build-mac -G Xcode -DJUCE_DIR="$RUNNER_TEMP/JUCE" -DKB09_BUILD_AU=ON -DKB09_BUILD_AAX=OFF '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build plug-ins and tests
        if: inputs.validated_run == ''
        run: cmake --build build-mac --config Release --target SH09_AU SH09_VST3 SH09_Standalone SH09Host SH09DSPTests SH09ResonanceIntegrationTests SH09FilterNonlinearTests SH09ProcessorTests KB09MidiMappingTests KB09StandaloneMidiTests KB09ControlResponseTests KB09RateLampTests KB09StartupDialogTests SH09PresetFilesTests SH09FactoryAudition KB09UpdateTests KB09MidiInputMemoryTests SH09GUIRender KB09DialogPreview --parallel 3
      - name: Rebuild validated production formats for package transfer
        if: inputs.validated_run != ''
        run: |
          cmake --build build-mac --config Release --target SH09_AU SH09_VST3 SH09_Standalone SH09FactoryAudition --parallel 3
          ctest --test-dir build-mac -C Release -R '^SH09FactoryBank$' --output-on-failure
      - name: Test audio engine and presets
        if: inputs.validated_run == ''
        run: ctest --test-dir build-mac -C Release --output-on-failure
      - name: Repeat real MIDI feedback interleaving checks
        if: inputs.validated_run == ''
        run: |
          for attempt in 1 2 3; do
            build-mac/KB09MidiMappingTests_artefacts/Release/KB09MidiMappingTests
          done
      - name: Test audio settings scrolling and dialog layouts
        if: inputs.validated_run == ''
        run: build-mac/KB09DialogPreview_artefacts/Release/KB09DialogPreview dialog-validation
      - name: Test keyboard visual feedback and panel rendering
        if: inputs.validated_run == ''
        run: build-mac/SH09GUIRender_artefacts/Release/SH09GUIRender gui-validation
      - name: Preserve cheek-stage rendering evidence
        if: always() && inputs.validated_run == ''
        uses: actions/upload-artifact@v4
        with:
          name: KB-09-Mac-cheek-validation
          path: |
            gui-validation/cheek-age-*.png
            gui-validation/GUIRender.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Check architectures and sign for development testing
        shell: bash
        run: |
          set -euo pipefail
          for kind in AU VST3 Standalone; do
            if [ "$kind" = AU ]; then ext=component; elif [ "$kind" = VST3 ]; then ext=vst3; else ext=app; fi
            bundle="build-mac/SH09_artefacts/Release/$kind/Toyland KB-09.$ext"
            lipo "$bundle/Contents/MacOS/Toyland KB-09" -verify_arch arm64 x86_64
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict "$bundle"
          done
      - name: Run Apple AU validation on this runner
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p '/Library/Audio/Plug-Ins/Components'
          sudo ditto 'build-mac/SH09_artefacts/Release/AU/Toyland KB-09.component' '/Library/Audio/Plug-Ins/Components/Toyland KB-09.component'
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "/Library/Audio/Plug-Ins/Components/Toyland KB-09.component/Contents/Info.plist"
          sudo killall -9 AudioComponentRegistrar || true
          for attempt in 1 2 3 4 5; do
            auval -a > au-components.txt
            if grep -q Sh09 au-components.txt; then break; fi
            sleep 2
          done
          auval -v aumu Sh09 PrIv | tee auval.txt
      - name: Test real hosted RATE view in VST3 and AU
        if: inputs.validated_run == ''
        run: |
          build-mac/SH09Host_artefacts/Release/SH09Host 'build-mac/SH09_artefacts/Release/VST3/Toyland KB-09.vst3' --rate-host284
          build-mac/SH09Host_artefacts/Release/SH09Host 'AudioUnit:Synths/aumu,Sh09,PrIv' --rate-host284
      - name: Package Mac release
        shell: bash
        run: |
          set -euo pipefail
          folder='Toyland KB-09 for Mac'
          mkdir -p "$folder/Support"
          sudo ditto 'build-mac/SH09_artefacts/Release/AU/Toyland KB-09.component' "$folder/Support/Toyland KB-09.component"
          ditto 'build-mac/SH09_artefacts/Release/VST3/Toyland KB-09.vst3' "$folder/Support/Toyland KB-09.vst3"
          ditto 'build-mac/SH09_artefacts/Release/Standalone/Toyland KB-09.app' "$folder/Toyland KB-09 Standalone.app"
          mkdir -p "$folder/Support/User Guide"
          cp 'docs/manual/platforms/mac/User Manual.html' "$folder/Support/User Guide/index.html"
          cp 'docs/manual/platforms/mac/User Manual.html' "$folder/User Manual.html"
          mkdir -p "$folder/Support/Licenses"
          ditto 'build-mac/factory-auditions/Factory Presets' "$folder/Support/Factory Presets"
          cp Assets/Fonts/OFL.txt "$folder/Support/Licenses/OFL-Jost.txt"
          cp LICENSE.md "$folder/Support/Licenses/KB-09-LICENSE.md"
          cp auval.txt "$folder/Support/auval.txt"
          cp au-components.txt "$folder/Support/au-components.txt"
          cp tools/install-mac.command "$folder/INSTALL KB-09.command"
          chmod +x "$folder/INSTALL KB-09.command"
          cp docs/open-me-first-mac.html "$folder/OPEN ME FIRST!.html"
          ditto -c -k --sequesterRsrc --keepParent "$folder" 'Toyland KB-09 for Mac.zip'
      # Release assets are not subject to the Actions artifact-storage quota.
      # Keep this transfer private as a draft; publish the final GitHub release separately.
      - name: Preserve validated Mac package as a draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(SH09 VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          test -n "$version"
          tag="build-transfer-$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Private package transfer $version" --notes "Validated internal build transfer; the public GitHub release is published separately."
          fi
          gh release upload "$tag" 'Toyland KB-09 for Mac.zip' --clobber



